# Install once with `pre-commit install`. Hooks run on every commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files   # stops accidental commits of data/model files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-toml
        # Windows Smart App Control blocks the unsigned check-toml.exe launcher
        # (WinError 4551); running the same module via the hook env's python avoids it.
        entry: python -m pre_commit_hooks.check_toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    # One run per lockfile, like CI and `make security`: pip-audit rejects a package
    # pinned in two -r files at once (attrs is in base and dev).
    hooks:
      - &pip-audit
        id: pip-audit
        name: pip-audit base
        args: ["--strict", "--require-hashes", "--disable-pip", "-r", "requirements/base.txt"]
        files: ^requirements/.*\.txt$
      - <<: *pip-audit
        name: pip-audit dev
        args: ["--strict", "--require-hashes", "--disable-pip", "-r", "requirements/dev.txt"]
      - <<: *pip-audit
        name: pip-audit laya
        args: ["--strict", "--require-hashes", "--disable-pip", "-r", "requirements/laya.txt"]
      - <<: *pip-audit
        name: pip-audit gnn
        args: ["--strict", "--require-hashes", "--disable-pip", "-r", "requirements/gnn.txt"]
      - <<: *pip-audit
        name: pip-audit llm
        args: ["--strict", "--require-hashes", "--disable-pip", "-r", "requirements/llm.txt"]

  # Python tooling runs from the project venv so hooks use exactly the versions in
  # requirements/dev.txt. Remote hook pins drifted from the lockfile (ruff 0.6.9 vs
  # 0.17.1) and made files flip formatting between commits.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: bandit
        name: bandit
        entry: bandit -c pyproject.toml -r src
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
