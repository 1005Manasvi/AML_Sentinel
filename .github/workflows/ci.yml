name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); version in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
          pip install --no-deps -e .
      - name: ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: mypy --strict
        run: mypy
      - name: pytest + coverage (>= 85%)
        run: pytest --cov-report=xml
      - name: bandit
        run: bandit -c pyproject.toml -r src
      - name: pip-audit (every lockfile, including optional stacks)
        run: |
          for lock in base dev laya gnn llm; do
            pip-audit --strict --require-hashes --disable-pip -r requirements/$lock.txt
          done

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
